# Cloud assessment module overlay. Opt-in:   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up --build
# The base docker-compose.yml is not modified; without this file the module does not exist at runtime.
#
# Isolation model for the scanner (it parses untrusted customer files):
#   * attached ONLY to an `internal` network: no route to the internet or to the database
#   * no published ports, no env_file, no volumes, no docker socket, no credentials
#   * non-root, read-only root filesystem, all capabilities dropped, no privilege escalation
#   * hard CPU / memory / process limits
x-scanner-hardening: &scanner-hardening
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 1g
  cpus: 1.0
  restart: unless-stopped

services:
  cloud-scanner:
    <<: *scanner-hardening
    build:
      context: .
      dockerfile: cloud/Dockerfile
    environment:
      CLOUD_MODULE_ENABLED: "true"
    expose:
      - "8100"
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    networks:
      - cloud_scan

  # Enable the module in the existing services and let them reach the scanner (and only them).
  backend:
    environment:
      CLOUD_MODULE_ENABLED: "true"
      CLOUD_SCANNER_URL: "http://cloud-scanner:8100"
    networks:
      - default
      - cloud_scan

  worker:
    environment:
      CLOUD_MODULE_ENABLED: "true"
      CLOUD_SCANNER_URL: "http://cloud-scanner:8100"
    networks:
      - default
      - cloud_scan

  # Recurring cloud scans (RTM S23). Same backend image, separate process: the existing worker and its schedules are untouched.
  # Idle unless CLOUD_MODULE_ENABLED is on; only needs the database (backend/.env) and the scanner.
  cloud-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.cloud_scheduler"]
    env_file:
      - ./backend/.env
    environment:
      ENV: production
      REQUIRE_AUTH: "true"
      CLOUD_MODULE_ENABLED: "true"
      CLOUD_SCANNER_URL: "http://cloud-scanner:8100"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      disable: true                   # the image HEALTHCHECK probes the HTTP API, which this process does not serve
    tmpfs:
      - /tmp
    networks:
      - default
      - cloud_scan

networks:
  cloud_scan:
    internal: true
