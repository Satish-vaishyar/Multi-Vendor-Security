username admin role network-admin secret sha512 $6$Ab12Cd34$eF56gH78iJ90kL12mN34oP56qR78sT90uV12wX34yZ56aB78cD90eF12gH34iJ56kL78mN90oP12qR34sT56uV78wX90yZ12
