!
! Hardened core router - modelled on CIS Cisco IOS-XE benchmark settings
!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
no service config
service tcp-keepalives-in
service tcp-keepalives-out
!
hostname CORE-RTR-01
!
security passwords min-length 14
login block-for 120 attempts 3 within 60
!
aaa new-model
aaa local authentication attempts max-fail 5
aaa group server tacacs+ TACACS-GRP
 server name TAC1
 server name TAC2
!
aaa authentication login default group TACACS-GRP local
aaa authentication enable default group TACACS-GRP enable
aaa authorization exec default group TACACS-GRP local
aaa authorization commands 15 default group TACACS-GRP local
aaa accounting exec default start-stop group TACACS-GRP
aaa accounting commands 15 default start-stop group TACACS-GRP
!
clock timezone UTC 0 0
no ip source-route
no ip domain lookup
ip domain name core.example.net
no ip finger
no ip bootp server
!
enable secret 9 $9$3LAbCdEf$Gh1JkLmNoPqRsTuVwXyZ0123456789abcdefghijk
!
username breakglass privilege 15 secret 9 $9$5NoPqRsT$uvWxYz0123456789abcdefghijklmnopqrstuvwxy
!
tacacs server TAC1
 address ipv4 10.0.0.11
 key 7 06130A2D4B4D0A0A
tacacs server TAC2
 address ipv4 10.0.0.12
 key 7 05080F1C2243
!
archive
 log config
  logging enable
  hidekeys
 path flash:archive
 write-memory
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-256 hmac-sha2-512
no ip http server
no ip http secure-server
!
no cdp run
!
ntp authentication-key 1 md5 08314D5D1A48 7
ntp authenticate
ntp trusted-key 1
ntp source Loopback0
ntp server 10.0.0.1 key 1
ntp server 10.0.0.2 key 1
!
logging on
logging buffered 64000 informational
logging host 10.0.0.60
logging host 10.0.0.61
logging trap informational
!
ip access-list standard ACL-MGMT-VTY
 permit 10.0.0.0 0.0.0.255
 deny any log
!
ip access-list extended ACL-EDGE-IN
 deny   ip 10.0.0.0 0.255.255.255 any
 permit tcp any host 192.0.2.10 eq 443
 deny   ip any any log
!
control-plane
 service-policy input COPP-POLICY
!
snmp-server group MON v3 priv
snmp-server user monitor MON v3 auth sha 08314D5D1A48 priv aes 128 0822455D0A16
snmp-server host 10.0.0.70 version 3 priv monitor
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
interface TenGigabitEthernet0/0/0
 description Core uplink
 ip address 10.1.0.1 255.255.255.252
 ip access-group ACL-EDGE-IN in
 no ip redirects
 no ip proxy-arp
 no ip directed-broadcast
 ip verify unicast source reachable-via rx
 ip ospf message-digest-key 1 md5 7 0822455D0A16
 ip ospf authentication message-digest
!
interface TenGigabitEthernet0/0/1
 description Core downlink
 ip address 10.1.0.5 255.255.255.252
 no ip redirects
 no ip proxy-arp
 no ip directed-broadcast
 ip verify unicast source reachable-via rx
 ip ospf message-digest-key 1 md5 7 0822455D0A16
 ip ospf authentication message-digest
!
router ospf 1
 router-id 10.255.0.1
 passive-interface default
 no passive-interface TenGigabitEthernet0/0/0
 no passive-interface TenGigabitEthernet0/0/1
 network 10.1.0.0 0.0.0.255 area 0
!
router bgp 65001
 neighbor 10.1.0.2 remote-as 65002
 neighbor 10.1.0.2 password 7 045802150C2E1D1C5A
 neighbor 10.1.0.6 remote-as 65003
 neighbor 10.1.0.6 password 7 104D000A0618
!
flow exporter EXP1
 destination 10.0.0.80
!
banner login ^C
Unauthorized access is prohibited. All activity is logged.
^C
banner motd ^C
Authorized use only.
^C
banner exec ^C
You are logged in to a monitored device.
^C
!
line con 0
 exec-timeout 5 0
 login authentication default
 transport output none
line aux 0
 no exec
 transport input none
line vty 0 15
 access-class ACL-MGMT-VTY in
 exec-timeout 5 0
 login authentication default
 transport input ssh
!
end
