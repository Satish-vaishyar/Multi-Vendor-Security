set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.0.0.1
set deviceconfig system dns-setting servers primary 10.0.0.53
set deviceconfig system timezone Asia/Kolkata
set deviceconfig system login-banner "Authorised use only. Activity is logged."
