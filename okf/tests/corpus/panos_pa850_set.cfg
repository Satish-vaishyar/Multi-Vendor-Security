set mgt-config users soc-analyst phash $5$zyxwvuts$ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefg
set mgt-config users soc-analyst permissions role-based devicereader yes
set mgt-config password-complexity enabled yes
