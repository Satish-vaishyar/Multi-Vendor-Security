#config-version=FG100F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=7234567890123456
#buildno=1517
#global_vdom=1
config system global
    set admin-console-timeout 300
    set admin-https-redirect enable
    set admin-lockout-duration 120
    set admin-lockout-threshold 5
    set admintimeout 30
    set alias "FortiGate-100F"
    set hostname "FGT-EDGE-01"
    set pre-login-banner enable
    set revision-backup-on-logout enable
    set ssh-cbc-cipher enable
    set ssl-min-proto-version TLSv1-1
    set timezone 28
end
config system password-policy
    set status enable
    set minimum-length 12
    set min-upper-case-letter 1
    set min-number 1
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
        set snmp-index 1
    next
    edit "lan"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh snmp fgfm
        set type hard-switch
        set role lan
        set lldp-reception enable
    next
    edit "dmz"
        set vdom "root"
        set ip 172.16.5.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ==
    next
    edit "netops"
        set accprofile "super_admin"
        set vdom "root"
        set trusthost1 10.10.0.0 255.255.255.0
        set password ENC SH2zyxwvutsrqponmlkjihgfedcba9876543210ZYXWVUTSRQPONMLKJIHGFEDCBA==
    next
end
config user tacacs+
    edit "TACACS1"
        set server "10.10.0.11"
        set key ENC abcdefghijklmnop==
    next
end
config system ntp
    set ntpsync enable
    set type custom
    set syncinterval 60
    config ntpserver
        edit 1
            set server "10.10.0.1"
        next
    end
end
config system snmp sysinfo
    set status enable
    set description "Edge firewall"
end
config system snmp community
    edit 1
        set name "public"
        set status enable
        config hosts
            edit 1
                set ip 10.10.0.70 255.255.255.255
            next
        end
    next
    edit 2
        set name "nms-v2"
        set status enable
    next
end
config system snmp user
    edit "monitor"
        set security-level auth-priv
        set auth-proto sha
        set auth-pwd ENC vwxyz==
        set priv-proto aes
        set priv-pwd ENC 12345==
    next
end
config log syslogd setting
    set status enable
    set server "10.10.0.60"
    set mode udp
    set port 514
end
config log memory setting
    set status enable
end
config firewall address
    edit "LAN-NET"
        set subnet 10.10.0.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "lan"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN-NET"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set nat enable
    next
    edit 2
        set name "temp-any"
        set srcintf "dmz"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
config vpn ipsec phase1-interface
    edit "SITE-B"
        set interface "wan1"
        set ike-version 1
        set proposal aes256-sha1 3des-sha1
        set dhgrp 2
        set remote-gw 198.51.100.7
        set psksecret ENC mnopqr==
    next
end
config vpn ipsec phase2-interface
    edit "SITE-B-P2"
        set phase1name "SITE-B"
        set proposal aes256-sha1
        set pfs disable
    next
end
