# SIH-26155 production stack. DB is Supabase Postgres (see backend/.env DATABASE_URL).
# Usage:
#   1. cp backend/.env.example backend/.env   # fill JWT_SECRET, DATABASE_URL, CORS_ORIGINS
#   2. docker compose up --build
# Frontend: http://localhost:8080 (terminate TLS in front of it) | Backend: internal only, not published.
# No default passwords live in this file: every secret comes from backend/.env, which is git-ignored and
# excluded from the image build context (see .dockerignore).
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  restart: unless-stopped

# Python services: immutable root filesystem (code and virtualenv are root-owned already) and bounded resources.
# The only writable paths are the /tmp tmpfs; HOME and the library caches are pointed there.
x-python-runtime: &python-runtime
  read_only: true
  mem_limit: 3g
  cpus: 2.0
  tmpfs:
    - /tmp:size=512m,nosuid,nodev
  environment: &python-env
    HOME: /tmp
    XDG_CACHE_HOME: /tmp/.cache
    HF_HOME: /tmp/.cache/huggingface
    MPLCONFIGDIR: /tmp/.cache/matplotlib

services:
  backend:
    <<: [*hardening, *python-runtime]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      <<: *python-env
      ENV: production
      REQUIRE_AUTH: "true"
      ENABLE_DOCS: "false"
      EMBEDDED_WORKER: "false"        # audits run in the dedicated worker service below
    # Not published on the host: only the frontend proxy reaches the API.
    expose:
      - "8000"

  # Background jobs (audits, reports, fleet batches). Same image; scale with: docker compose up --scale worker=3
  worker:
    <<: [*hardening, *python-runtime]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./backend/.env
    environment:
      <<: *python-env
      ENV: production
      REQUIRE_AUTH: "true"
    healthcheck:
      disable: true                   # the image HEALTHCHECK probes the HTTP API, which the worker does not serve

  frontend:
    <<: *hardening
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    # nginx-unprivileged listens on 8080 as a non-root user: no capabilities are added back.
    ports:
      - "8080:8080"
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
