# Production: SPA fallback + /api proxy to the backend service. Runs as an unprivileged user (nginx-unprivileged image).
# TLS is expected to be terminated in front of this container (load balancer / ingress / a certbot-managed nginx);
# every response here carries HSTS so browsers stay on HTTPS.
server_tokens off;

# ---- edge abuse limits (the API also rate-limits per org / per account; these stop floods before Python sees them) ----
limit_req_zone $binary_remote_addr zone=api_all:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Real client address. If a load balancer / ingress sits in front of this container, $remote_addr is the balancer:
  # trust ITS header instead, e.g.
  #   set_real_ip_from 10.0.0.0/8;   real_ip_header X-Forwarded-For;   real_ip_recursive on;
  # Never trust a client-supplied X-Forwarded-For (the backend throttles logins and writes the audit log by this address).

  # Slow-loris / oversized-request guards. Default body cap is small; only the upload routes below raise it.
  client_max_body_size 1m;
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  keepalive_timeout 30s;
  large_client_header_buffers 4 16k;
  limit_conn per_ip 100;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Login: tight per-address rate on top of the backend's account lockout and per-IP throttle.
  location = /api/v1/auth/login {
    limit_req zone=api_login burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Config uploads: 20 x 5 MB (bulk-upload) + multipart overhead / fleet bulk-audit. Matches MAX_UPLOAD_BODY_BYTES (110 MB).
  location ~ ^/api/v1/(configurations/(upload|bulk-upload)|jobs/bulk-audit)$ {
    limit_req zone=api_all burst=20 nodelay;
    client_max_body_size 110m;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering on;
  }

  location /api/ {
    limit_req zone=api_all burst=60 nodelay;
    client_max_body_size 8m;          # = MAX_JSON_BODY_BYTES
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE with the connecting address: appending would keep whatever the client sent as the first hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering on;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # add_header in a location resets the inherited server-level headers: re-include them
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Never serve dotfiles (.env, .git ...) or source maps left in the build.
  location ~ ^/(?!api/)(.*/)?\.(?!well-known/) { return 404; }
  location ~* ^/(?!api/).*\.map$ { return 404; }
}
