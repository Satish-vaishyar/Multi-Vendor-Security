[project]
name = "sih26155-backend"
version = "1.0.0"
description = "AI-Driven Multi-Vendor Network Security Compliance Auditor — unified FastAPI backend (arch.md + api.md), integrating okf/ knowledge layer and models/ M1-M13"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "reportlab>=4.1",
    "joblib>=1.4",
    "scikit-learn>=1.4",
    "packaging>=24.0",
    "psycopg[binary]>=3.2",
    "hdbscan>=0.8.44",
    "sentence-transformers>=3.0",
    "torch>=2.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-cov>=6"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
