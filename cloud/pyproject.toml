[project]
name = "orbit-cloud"
version = "0.1.0"
description = "Orbit cloud security assessment module (scanner side). Isolated from the backend; own dependencies."
requires-python = ">=3.11"
# Runtime dependencies are kept out of backend/pyproject.toml on purpose (RTM CM-152).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "python-hcl2>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
